<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>釣り鐘解析・自動カウントシステム</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 0; }
        * { box-sizing: border-box; }
        h2, h3 { color: #569cd6; margin: 10px 0 5px 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #252526; padding: 10px; border-bottom: 1px solid #3e3e42; position: sticky; top: 0; z-index: 100; }
        .clock { font-size: 1.5em; color: #4fc1ff; font-family: monospace; font-weight: bold; }
        
        .toolbar { display: flex; gap: 5px; padding: 10px; background: #2d2d2d; flex-wrap: wrap; }
        button { flex: 1; min-width: 120px; background-color: #0e639c; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        button:active { background-color: #1177bb; }
        button:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        .btn-setting { background-color: #512da8; }
        .btn-record-off { background-color: #6c757d; }
        .btn-record-on { background-color: #dc3545; animation: blink-bg 2s infinite; }
        
        @keyframes blink-bg { 50% { background-color: #a71d2a; } }

        .container { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background-color: #2d2d2d; border: 1px solid #3e3e42; border-radius: 8px; padding: 12px; }
        
        canvas { background-color: #000; border: 1px solid #555; width: 100%; height: 120px; border-radius: 4px; display: block; margin-bottom: 5px; }
        
        .count-display { font-size: 4em; font-weight: bold; color: #4fc1ff; text-align: center; line-height: 1; margin: 10px 0; }
        .timer-msg { font-size: 1.2em; color: #dcdcaa; font-weight: bold; text-align: center; min-height: 1.5em; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th, td { border: 1px solid #555; padding: 8px 5px; text-align: center; }
        th { background-color: #333; }
        .log-wrap { max-height: 150px; overflow-y: auto; }
        
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 12px; background-color: #555; font-size: 0.8em; font-weight: bold; margin-bottom: 5px; }
        .status-active { background-color: #28a745; color: white; }
        .status-recording { background-color: #dc3545; color: white; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        dialog { background-color: #1e1e1e; color: #d4d4d4; border: 2px solid #007acc; border-radius: 10px; width: 95%; max-width: 400px; padding: 15px; margin: auto; }
        dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9em; }
        input[type="number"], input[type="time"] { background-color: #3c3c3c; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; width: 80px; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 1.1em; font-weight: bold; color: #fff;">鐘解析システム</div>
    <div class="clock" id="clockDisplay">00:00:00</div>
</div>

<div class="toolbar">
    <button id="btnStartAudio">🎤 マイク接続</button>
    <button id="btnToggleRecord" class="btn-record-off">⏺ 録画: OFF</button>
    <button id="btnOpenSettings" class="btn-setting">⚙️ 設定</button>
</div>

<div class="container">
    <div class="panel">
        <div style="display: flex; justify-content: space-between;">
            <span id="audioStatus" class="status-badge">監視: 停止中</span>
            <span id="recordingStatus" class="status-badge" style="display:none;">🔴 動画保存中...</span>
        </div>
        
        <h3 style="font-size: 1em;">波形 (Time Domain)</h3>
        <canvas id="waveformCanvas"></canvas>
        
        <h3 style="font-size: 1em;">スペクトル (Frequency Domain)</h3>
        <canvas id="spectrumCanvas"></canvas>
    </div>

    <div class="panel" style="border-color: #4fc1ff;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <h2 style="margin: 0;">検知カウント</h2>
            <button id="btnResetCount" style="min-width: auto; padding: 5px 10px; font-size: 0.8em; background: #555;">リセット</button>
        </div>
        <div class="count-display"><span id="bellCount">0</span></div>
    </div>
</div>

<dialog id="settingsDialog">
    <h2 style="margin-top:0;">システム設定</h2>
    
    <div style="background: #2d2d2d; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        <h3>学習機能（指紋作成）</h3>
        <div id="learningResult" style="font-size: 0.9em; margin-bottom: 10px; color: #ce9178;">未学習</div>
        <div style="display: flex; gap: 5px; flex-wrap: wrap;">
            <button id="btnLearnStart" style="padding: 8px;">学習開始</button>
            <button id="btnResetPeaks" style="padding: 8px; background: #d13438;">初期値リセット</button>
        </div>
    </div>

    <button id="btnCloseSettings" style="width: 100%; background-color: #555;">閉じる</button>
</dialog>

<!-- 録画用の隠しキャンバス -->
<canvas id="recordCanvas" width="640" height="360" style="display: none;"></canvas>

<script>
    // --- 初期値とステート管理 ---
    const DEFAULT_PEAKS = [27, 34, 19, 31, 13];
    let state = { count: 0, logs: [], learnedPeaks: [...DEFAULT_PEAKS], threshold: 130 };
    
    // ローカルストレージから読み込み
    const savedState = localStorage.getItem('bellhakei_state_v5');
    if (savedState) { 
        state = JSON.parse(savedState);
        // 古いデータにlearnedPeaksがない場合の対策
        if(!state.learnedPeaks || state.learnedPeaks.length === 0) {
            state.learnedPeaks = [...DEFAULT_PEAKS];
        }
    }
    
    function saveState() { 
        localStorage.setItem('bellhakei_state_v5', JSON.stringify(state)); 
    }

    // --- UIの更新 ---
    function updateLearningUI() {
        document.getElementById('learningResult').textContent = '現在の設定値: [' + state.learnedPeaks.join(', ') + ']';
    }
    updateLearningUI();
    document.getElementById('bellCount').textContent = state.count;

    // --- 時計 ---
    setInterval(() => {
        const now = new Date();
        document.getElementById('clockDisplay').textContent = 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0') + ':' + 
            String(now.getSeconds()).padStart(2, '0');
    }, 1000);

    // --- ダイアログ制御 ---
    const dialog = document.getElementById('settingsDialog');
    document.getElementById('btnOpenSettings').addEventListener('click', () => dialog.showModal());
    document.getElementById('btnCloseSettings').addEventListener('click', () => dialog.close());

    // --- 初期値リセットボタン ---
    document.getElementById('btnResetPeaks').addEventListener('click', () => {
        state.learnedPeaks = [...DEFAULT_PEAKS];
        saveState();
        updateLearningUI();
        alert('初期値にリセットしました。\n' + JSON.stringify(state.learnedPeaks));
    });

    document.getElementById('btnResetCount').addEventListener('click', () => {
        state.count = 0;
        document.getElementById('bellCount').textContent = 0;
        saveState();
    });

    // --- オーディオ・キャンバス変数の準備 ---
    let audioContext, analyser, microphone, dataArray, freqArray;
    let isAnalyzing = false, isRinging = false;
    let cooldownTimer = null;
    
    const wCanvas = document.getElementById('waveformCanvas');
    const sCanvas = document.getElementById('spectrumCanvas');
    const rCanvas = document.getElementById('recordCanvas');
    const ctxW = wCanvas.getContext('2d');
    const ctxS = sCanvas.getContext('2d');
    const ctxR = rCanvas.getContext('2d');
    
    // --- 録画関連の変数 ---
    let globalAudioStream = null;
    let isRecordFeatureOn = false;
    let isRecordingNow = false;

    // キャンバスのリサイズ
    function resizeCanvas() {
        wCanvas.width = wCanvas.clientWidth;
        sCanvas.width = sCanvas.clientWidth;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudioContext() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
    }

    // --- 録画機能のON/OFF切り替え ---
    document.getElementById('btnToggleRecord').addEventListener('click', (e) => {
        isRecordFeatureOn = !isRecordFeatureOn;
        const btn = e.target;
        if (isRecordFeatureOn) {
            btn.textContent = '⏺ 録画: ON';
            btn.className = 'btn-record-on';
        } else {
            btn.textContent = '⏺ 録画: OFF';
            btn.className = 'btn-record-off';
        }
    });

    // --- マイク接続処理 ---
    document.getElementById('btnStartAudio').addEventListener('click', async () => {
        initAudioContext();
        if (isAnalyzing) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            globalAudioStream = stream;
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            freqArray = new Uint8Array(analyser.frequencyBinCount);
            
            isAnalyzing = true;
            document.getElementById('audioStatus').textContent = '監視: 実行中';
            document.getElementById('audioStatus').classList.add('status-active');
            
            const btn = document.getElementById('btnStartAudio');
            btn.disabled = true;
            btn.textContent = 'マイク接続済み';
            btn.style.backgroundColor = '#28a745';

            draw();
            detectLoop();
        } catch (err) {
            alert('マイクのアクセスが拒否されました: ' + err.message);
        }
    });

    // --- 描画処理 (周波数のメモリと数値を追加) ---
    function draw() {
        if (!isAnalyzing) return;
        requestAnimationFrame(draw);

        // 1. 波形描画
        analyser.getByteTimeDomainData(dataArray);
        ctxW.fillStyle = '#000';
        ctxW.fillRect(0, 0, wCanvas.width, wCanvas.height);
        ctxW.lineWidth = 2;
        ctxW.strokeStyle = '#4fc1ff';
        ctxW.beginPath();
        let sliceWidth = wCanvas.width * 1.0 / dataArray.length;
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
            let v = dataArray[i] / 128.0;
            let y = v * wCanvas.height / 2;
            if (i === 0) ctxW.moveTo(x, y);
            else ctxW.lineTo(x, y);
            x += sliceWidth;
        }
        ctxW.lineTo(wCanvas.width, wCanvas.height / 2);
        ctxW.stroke();

        // 2. スペクトル描画と周波数メモリ
        analyser.getByteFrequencyData(freqArray);
        ctxS.fillStyle = '#000';
        ctxS.fillRect(0, 0, sCanvas.width, sCanvas.height);
        
        let barWidth = (sCanvas.width / freqArray.length) * 2.5;
        let barX = 0;
        for (let i = 0; i < freqArray.length; i++) {
            let barHeight = (freqArray[i] / 255) * sCanvas.height;
            ctxS.fillStyle = `rgb(${freqArray[i] + 100}, 50, 50)`;
            ctxS.fillRect(barX, sCanvas.height - barHeight, barWidth, barHeight);
            barX += barWidth + 1;
        }

        // 周波数のメモリと数値を描画
        const sampleRate = audioContext.sampleRate || 44100;
        const nyquist = sampleRate / 2;
        const numTicks = 5;
        
        ctxS.fillStyle = '#ffffff';
        ctxS.font = '10px sans-serif';
        ctxS.textAlign = 'center';
        
        for (let i = 1; i <= numTicks; i++) {
            let freq = (nyquist / numTicks) * i;
            let tickX = (sCanvas.width / numTicks) * i;
            
            // 縦線
            ctxS.beginPath();
            ctxS.moveTo(tickX, 0);
            ctxS.lineTo(tickX, sCanvas.height);
            ctxS.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctxS.stroke();
            
            // 数値テキスト (kHz)
            ctxS.fillText(`${Math.round(freq / 1000)}kHz`, tickX - 15, 15);
        }

        // 3. 録画用キャンバスに合成描画
        if (isRecordFeatureOn) {
            ctxR.fillStyle = '#000';
            ctxR.fillRect(0, 0, rCanvas.width, rCanvas.height);
            // 上半分に波形、下半分にスペクトルを描画
            ctxR.drawImage(wCanvas, 0, 0, rCanvas.width, rCanvas.height / 2);
            ctxR.drawImage(sCanvas, 0, rCanvas.height / 2, rCanvas.width, rCanvas.height / 2);
            
            // カウント数のオーバーレイ
            ctxR.fillStyle = '#4fc1ff';
            ctxR.font = '30px sans-serif';
            ctxR.fillText(`Count: ${state.count}`, 20, 40);
        }
    }

    // --- 音声検知と録画トリガー ---
    function detectLoop() {
        if (!isAnalyzing) return;
        setTimeout(detectLoop, 100); // 毎秒10回チェック

        analyser.getByteFrequencyData(freqArray);
        
        // 簡易的なピーク強度判定
        let maxIntensity = 0;
        for(let i=0; i<freqArray.length; i++) {
            if(freqArray[i] > maxIntensity) maxIntensity = freqArray[i];
        }

        // 閾値を超えたら「打鐘」と判定
        if (maxIntensity > state.threshold && !isRinging) {
            isRinging = true;
            
            // カウントアップ
            state.count++;
            document.getElementById('bellCount').textContent = state.count;
            saveState();

            // 録画機能がONなら録画開始
            if (isRecordFeatureOn && !isRecordingNow) {
                triggerRecording();
            }

            // 連続検知を防ぐためのクールダウン（2秒間）
            clearTimeout(cooldownTimer);
            cooldownTimer = setTimeout(() => {
                isRinging = false;
            }, 2000);
        }
    }

    // --- 録画処理（スマホ・PC両対応のトリガー方式） ---
    function triggerRecording() {
        if (!globalAudioStream) return;
        isRecordingNow = true;
        document.getElementById('recordingStatus').style.display = 'inline-block';

        // 録画用キャンバスとマイク音声を結合
        const canvasStream = rCanvas.captureStream(30);
        const audioTracks = globalAudioStream.getAudioTracks();
        const combinedStream = new MediaStream([
            ...canvasStream.getTracks(),
            ...audioTracks
        ]);

        // スマホ(Safari等)とPCで対応しているMIMEタイプを自動判別
        let mimeType = '';
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
            mimeType = 'video/webm;codecs=vp8,opus';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
            mimeType = 'video/mp4'; // iOS Safari向け
        } else {
            mimeType = 'video/webm'; // デフォルト
        }

        const recorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
        const chunks = [];

        recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            document.body.appendChild(a);
            a.style = 'display: none';
            a.href = url;
            // 拡張子をMIMEタイプに合わせて変更
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            a.download = `bell_record_${new Date().getTime()}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
            
            isRecordingNow = false;
            document.getElementById('recordingStatus').style.display = 'none';
        };

        recorder.start();

        // 4秒間録画して自動停止（短い動画として保存）
        setTimeout(() => {
            if (recorder.state === 'recording') {
                recorder.stop();
            }
        }, 4000);
    }
</script>
</body>
</html>
